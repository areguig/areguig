<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Akli Reguig. I build backends. Lately, agents too.">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ecebe6" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#d4ff3f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4ff3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0.3" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="440" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="440" rx="28"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; font-style: italic; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ln { opacity: 0; animation: show 0.01s forwards; }
      .l1 { animation-delay: 0.4s } .l2 { animation-delay: 1.1s } .l3 { animation-delay: 1.8s }
      .l4 { animation-delay: 2.6s } .l5 { animation-delay: 3.2s } .l6 { animation-delay: 3.8s } .l7 { animation-delay: 4.6s }
      .type { clip-path: inset(0 100% 0 0); animation: type 1.4s steps(46) 1.9s forwards; }
      .cursor { animation: blink 1s step-end infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes show { to { opacity: 1 } }
      @keyframes type { to { clip-path: inset(0 0 0 0) } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
      @media (prefers-reduced-motion: reduce) { .ln, .type { animation: none; opacity: 1; clip-path: none } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#08080a"/>
    <rect width="1200" height="440" fill="url(#grid)" mask="url(#gridmask)"/>
    <rect width="1200" height="440" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="28" fill="none" stroke="#26262d"/>

  <g class="mono" font-size="13" letter-spacing="3" fill="#8a8981">
    <line x1="56" y1="82" x2="84" y2="82" stroke="#8a8981"/>
    <text x="96" y="87">AKLI REGUIG · FREELANCE SOFTWARE ENGINEER · PARIS</text>
  </g>
  <g class="sans" font-weight="700" font-size="66" letter-spacing="-2.6">
    <text x="52" y="190" fill="#ecebe6">I build backends.</text>
    <text x="52" y="268" fill="#a3a29b">Lately,<tspan dx="18" class="serif" font-weight="400" letter-spacing="0" font-size="72" fill="#d4ff3f">agents</tspan><tspan dx="16">too.</tspan></text>
  </g>
  <g class="sans" font-size="17" fill="#a3a29b">
    <text x="56" y="336">Java, Spring and DevOps for over ten years.</text>
    <text x="56" y="362">Now AI agents that do real work for real teams.</text>
  </g>
  <circle class="pulse" cx="62" cy="398" r="5" fill="#d4ff3f"/>
  <text class="mono" x="76" y="403" font-size="13" fill="#8a8981">areguig.github.io</text>

  <g transform="translate(676 96)">
    <rect width="472" height="268" rx="16" fill="#0e0e11" stroke="#26262d"/>
    <path d="M0 40h472" stroke="#26262d"/>
    <circle cx="22" cy="20" r="5.5" fill="#3a3a44"/><circle cx="40" cy="20" r="5.5" fill="#3a3a44"/><circle cx="58" cy="20" r="5.5" fill="#3a3a44"/>
    <text class="mono" x="80" y="24" font-size="11" fill="#8a8981">zsh · claude code</text>
    <g class="mono" font-size="12.5">
      <text class="ln l1" x="20" y="72"><tspan fill="#d4ff3f">~/areguig</tspan><tspan fill="#8a8981"> ❯ </tspan><tspan fill="#ecebe6">claude</tspan></text>
      <text class="ln l2" x="20" y="100" fill="#8a8981">🪨 petit-poucet · memory loaded</text>
      <g class="ln l3"><text class="type" x="20" y="128"><tspan fill="#ff7a45">&gt; </tspan><tspan fill="#ecebe6">make my profile as stunning as my site</tspan></text></g>
      <text class="ln l4" x="20" y="156"><tspan fill="#a6c932">● </tspan><tspan fill="#a3a29b">Read  areguig.github.io/src/content/site.ts</tspan></text>
      <text class="ln l5" x="20" y="184"><tspan fill="#a6c932">● </tspan><tspan fill="#a3a29b">Write assets/hero.svg</tspan></text>
      <text class="ln l6" x="20" y="212"><tspan fill="#a6c932">● </tspan><tspan fill="#a3a29b">Write README.md</tspan></text>
      <text class="ln l7" x="20" y="240"><tspan fill="#d4ff3f">✓ </tspan><tspan fill="#ecebe6">Done. You are reading it.</tspan><tspan class="cursor" fill="#ecebe6"> ▍</tspan></text>
    </g>
  </g>
</svg>
